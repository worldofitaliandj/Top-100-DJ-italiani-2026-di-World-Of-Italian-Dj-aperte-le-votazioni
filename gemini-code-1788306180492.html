<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondaggio e Votazione Online</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .poll-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        .poll-title { font-size: 1.5rem; color: #1f2937; margin-bottom: 24px; text-align: center; }
        .poll-options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px 18px; font-size: 1rem; color: #374151; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; text-align: left; }
        .option-btn:hover:not(:disabled) { border-color: #3b82f6; background: #eff6ff; }
        .option-btn:disabled { cursor: default; }
        .result-bar { position: absolute; top: 0; left: 0; height: 100%; background-color: rgba(59, 130, 246, 0.15); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
        .option-content { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .percent-text { font-weight: 600; color: #2563eb; display: none; }
        .show-results .percent-text { display: inline; }
        .total-votes { text-align: center; margin-top: 20px; color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="poll-card" id="pollCard">
    <h1 class="poll-title">Qual è la tua destinazione preferita?</h1>
    
    <div class="poll-options">
        <button class="option-btn" onclick="vote('opzione_1')" id="btn-opzione_1">
            <div class="result-bar" id="bar-opzione_1"></div>
            <div class="option-content">
                <span>Mare</span>
                <span class="percent-text" id="pct-opzione_1">0%</span>
            </div>
        </button>

        <button class="option-btn" onclick="vote('opzione_2')" id="btn-opzione_2">
            <div class="result-bar" id="bar-opzione_2"></div>
            <div class="option-content">
                <span>Montagna</span>
                <span class="percent-text" id="pct-opzione_2">0%</span>
            </div>
        </button>

        <button class="option-btn" onclick="vote('opzione_3')" id="btn-opzione_3">
            <div class="result-bar" id="bar-opzione_3"></div>
            <div class="option-content">
                <span>Città d'Arte</span>
                <span class="percent-text" id="pct-opzione_3">0%</span>
            </div>
        </button>
    </div>

    <div class="total-votes" id="totalVotes">Caricamento voti...</div>
</div>

<script>
    // 1. Incolla qui le tue credenziali Firebase
    const firebaseConfig = {
        apiKey: "TUA_API_KEY",
        authDomain: "TUO_PROJECT_ID.firebaseapp.com",
        projectId: "TUO_PROJECT_ID",
        storageBucket: "TUO_PROJECT_ID.appspot.com",
        messagingSenderId: "TUO_SENDER_ID",
        appId: "TUO_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const pollRef = db.collection('sondaggi').doc('sondaggio_1');

    // Controllo se l'utente ha già votato tramite LocalStorage
    let hasVoted = localStorage.getItem('voted_sondaggio_1');

    // Ascolto in tempo reale dei dati da Firebase
    pollRef.onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            updateUI(data);
        } else {
            // Inizializza il sondaggio se non esiste ancora
            pollRef.set({ opzione_1: 0, opzione_2: 0, opzione_3: 0 });
        }
    });

    function vote(option) {
        if (hasVoted) return;

        // Incremento atomico su Firebase
        pollRef.update({
            [option]: firebase.firestore.FieldValue.increment(1)
        }).then(() => {
            localStorage.setItem('voted_sondaggio_1', 'true');
            hasVoted = true;
        });
    }

    function updateUI(data) {
        const total = Object.values(data).reduce((a, b) => a + b, 0);
        document.getElementById('totalVotes').innerText = `Voti totali: ${total}`;

        if (hasVoted) {
            document.getElementById('pollCard').classList.add('show-results');
        }

        for (const [key, value] of Object.entries(data)) {
            const pct = total > 0 ? Math.round((value / total) * 100) : 0;
            const bar = document.getElementById(`bar-${key}`);
            const pctText = document.getElementById(`pct-${key}`);
            const btn = document.getElementById(`btn-${key}`);

            if (bar) bar.style.width = `${pct}%`;
            if (pctText) pctText.innerText = `${pct}% (${value})`;
            if (hasVoted && btn) btn.disabled = true;
        }
    }
</script>

</body>
</html>
